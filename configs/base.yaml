# K-Bézier CL — Base Configuration
# All values here are defaults; overridden by benchmark/ and method/ configs.

seed: 42
device: "cuda"        # "cuda" or "cpu"
num_workers: 4
pin_memory: true

# Logging
log_dir: "results"
tensorboard: true
log_interval: 50      # print every N batches

# Training defaults (overridden per benchmark/method)
epochs_per_task: 50
batch_size: 64
lr: 0.01
momentum: 0.9
weight_decay: 0.0

# Fisher estimation
fisher:
  update_freq: 1          # re-estimate Fisher every N tasks (1 = every task)
  samples: 1000            # number of samples for Fisher estimation
  damping: 1.0e-3          # λ in Tikhonov damping

# Reproducibility
deterministic: true        # torch.backends.cudnn.deterministic
benchmark_cudnn: false     # torch.backends.cudnn.benchmark (false for reproducibility)
