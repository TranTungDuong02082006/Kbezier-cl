# Permuted MNIST — smoke test benchmark
benchmark:
  name: "perm_mnist"
  dataset: "MNIST"
  n_tasks: 10
  scenario: "domain-IL"    # same 10 classes, different permutation per task
  input_size: [1, 28, 28]
  n_classes: 10

model:
  name: "mlp"
  hidden_sizes: [400, 400]
  dropout: 0.0

epochs_per_task: 5
batch_size: 128
lr: 0.01
